# Site settings
title: Beyond The Fold
email: ""
description: "News you probably missed. Underreported stories from around the world."
baseurl: ""
url: "[NewsBeyondTheFold.github.io](https://NewsBeyondTheFold.github.io)"
github_username: NewsBeyondTheFold

# Build settings
markdown: kramdown
permalink: /:year/:month/:title/

# Colours — used by the theme
brand-color: "#12284B"
accent-color: "#C9A227"
text-color: "#1A1A1A"
background-color: "#FBF8F1"

# Posts
paginate: 10
paginate_path: "/page:num/"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
